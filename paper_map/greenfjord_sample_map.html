    width: 7px; height: 7px; border-radius: 50%;
    background: #14324f; border: 1.5px solid #fff;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);

  /* ---- Glacier context box labels ---- */

    background: transparent; border: none; box-shadow: none;

    line-height: 1.5;
    backdrop-filter: blur(2px);

    display: flex; align-items: center; justify-content: center;

    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    font-size: 10px; flex: 0 0 auto;
  }
  .legend-count { color: #8a949e; font-size: 11.5px; margin-left: auto; padding-left: 8px; }

  .north-arrow {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 6px 8px 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);

    width: 46px;

  .north-arrow .n { font-weight: 800; font-size: 12px; letter-spacing: 0.05em; }

    border-radius: 8px;
    padding: 8px 12px;

  }

  .title-card p { margin: 3px 0 0; font-size: 11.5px; color: #55616d; }

3, "lon": -45.769, "cluster": "Cryosphere", "icon": "chart-line", "fg": "black", "bg": "#fff4f1", "type": "Seismometer", "loc": "Instruments", "year": ""}, {"lat": 61.314, "lon": -45.826, "cluster": "Cryosphere", "icon": "chart-line", "fg": "black", "bg": "#fff4f1", "type": "Seismometer", "loc": "Instruments", "year": ""}, {"lat": 61.282, "lon": -45.78, "cluster": "Cryosphere", "icon": "snowflake", "fg": "black", "bg": "#fff4f1", "type": "Interferometer", "loc": "Instruments", "year": ""}, {"lat": 61.282, "lon": -45.778, "cluster": "Cryosphere", "icon": "tent", "fg": "black", "bg": "#fff4f1", "type": "Camp", "loc": "Instruments", "year": ""}, {"lat": 61.312, "lon": -45.705, "cluster": "Cryosphere", "icon": "tent", "fg": "black", "bg": "#fff4f1", "type": "Camp", "loc": "Instruments", "year": ""}, {"lat": 61.321, "lon": -45.744, "cluster": "Cryosphere", "icon": "camera", "fg": "black", "bg": "#fff4f1", "type": "Timelapse camera", "loc": "Instruments", "year": ""}, {"lat": 61.284, "lon": -45.773, "cluster": "Cryosphere", "icon": "camera", "fg": "black", "bg": "#fff4f1", "type": "Timelapse camera", "loc": "Instruments", "year": ""}, {"lat": 61.314, "lon": -45.826, "cluster": "Cryosphere", "icon": "camera", "fg": "black", "bg": "#fff4f1", "type": "Timelapse camera", "loc": "Instruments", "year": ""}, {"lat": 61.31, "lon": -45.725, "cluster": "Cryosphere", "icon": "cloud-sun-rain", "fg": "black", "bg": "#fff4f1", "type": "Meteostation", "loc": "Instruments", "year": ""}, {"lat": 61.31, "lon": -45.693, "cluster": "Cryosphere", "icon": "temperature-half", "fg": "black", "bg": "#fff4f1", "type": "Instream pressure/temp", "loc": "Instruments", "year": ""}, {"lat": 61.31, "lon": -45.693, "cluster": "Cryosphere", "icon": "temperature-half", "fg": "black", "bg": "#fff4f1", "type": "Instream pressure/temp", "loc": "Instruments", "year": ""}, {"lat": 61.311, "lon": -45.729, "cluster": "Cryosphere", "icon": "wave-square", "fg": "black", "bg": "#fff4f1", "type": "Tideguage pressure", "loc": "Instruments", "year": ""}, {"lat": 61.311, "lon": -45.727, "cluster": "Cryosphere", "icon": "snowflake", "fg": "black", "bg": "#fff4f1", "type": "Shellfrags", "loc": "Instruments", "year": ""}, {"lat": 60.988, "lon": -45.914, "cluster": "Cryosphere", "icon": "ruler-vertical", "fg": "black", "bg": "#fff4f1", "type": "Ablation stakes", "loc": "Instruments", "year": ""}];
const LEGEND = [{"cluster": "Ocean", "label": "Ocean", "icon": "ship", "bg": "#32507d", "fg": "#eeeeee", "count": 57}, {"cluster": "Human", "label": "Human", "icon": "user", "bg": "#EF476F", "fg": "#eeeeee", "count": 9}, {"cluster": "Cryosphere", "label": "Cryosphere", "icon": "snowflake", "bg": "#fff4f1", "fg": "black", "count": 74}, {"cluster": "Atmosphere", "label": "Atmosphere", "icon": "wind", "bg": "#eddf77", "fg": "black", "count": 47}, {"cluster": "Land", "label": "Land", "icon": "droplet", "bg": "#FA9F42", "fg": "black", "count": 138}, {"cluster": "Biodiversity", "label": "Biodiversity", "icon": "fish", "bg": "#06D6A0", "fg": "black", "count": 141}];
const PLACES = [{"name": "Narsarsuaq", "lat": 61.155, "lon": -45.425}, {"name": "Narsaq", "lat": 60.913, "lon": -46.048}, {"name": "Qaqortoq", "lat": 60.718, "lon": -46.037}, {"name": "Igaliku", "lat": 60.99, "lon": -45.424}];
const GLACIER_BOXES = [{"label": "Ocean-terminating glacier", "bounds": [[61.28, -45.9], [61.4, -45.55]], "color": "#1b7a6b"}, {"label": "Land-terminating glacier", "bounds": [[60.94, -45.1], [61.06, -44.7]], "color": "#c9772f"}];
const INITIAL_BOUNDS = [[60.6, -46.55], [61.45, -44.75]];

// ------------------------------------------------------------------
// Base layers
// ------------------------------------------------------------------
const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 18,
    attribution:
      "Tiles &copy; Esri — Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, " +
      "Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom",
  }
);
const opentopo = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
      'SRTM | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
  }
);
const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 18,
    attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
  }
);

// Explicit centre/zoom so the view is always sane even before the container
// has been laid out (some embed/preview contexts report a 0x0 window at load,
// which would otherwise collapse fitBounds to max zoom).
const INITIAL_CENTER = [
  (INITIAL_BOUNDS[0][0] + INITIAL_BOUNDS[1][0]) / 2,
  (INITIAL_BOUNDS[0][1] + INITIAL_BOUNDS[1][1]) / 2,
];
const map = L.map("map", {
  center: INITIAL_CENTER,
  zoom: 9,
  layers: [terrain],
  zoomControl: true,
  scrollWheelZoom: true,
});

// Dedicated pane so place-names / glacier labels always sit above the sample
// markers (which Leaflet auto-orders by latitude and would otherwise cover them).
map.createPane("labels");
map.getPane("labels").style.zIndex = 650;
map.getPane("labels").style.pointerEvents = "none";

// Re-fit to the study area once the container genuinely has pixels. A
// ResizeObserver handles late layout robustly across browsers/embeds; we only
// auto-fit until the user first interacts with the map.
let userMoved = false;
map.on("zoomstart movestart", function () { userMoved = true; });
function fitStudyArea() {
  if (userMoved) return;
  const s = map.getSize();
  if (s.x < 50 || s.y < 50) return;      // container not ready yet
  map.invalidateSize();
  map.fitBounds(INITIAL_BOUNDS, { padding: [20, 20] });
}
if (window.ResizeObserver) {
  new ResizeObserver(fitStudyArea).observe(document.getElementById("map"));
}
window.addEventListener("load", fitStudyArea);
map.whenReady(fitStudyArea);

L.control.layers(
  { "Terrain (Esri)": terrain, "Topographic (OpenTopoMap)": opentopo, "Satellite (Esri)": satellite },
  {},
  { position: "topright", collapsed: true }
).addTo(map);

// ------------------------------------------------------------------
// Sample markers  (one styled div-icon badge per row)
// ------------------------------------------------------------------
function badgeIcon(s) {
  const html =
    '<div class="sample-badge" style="background:' + s.bg + ';color:' + s.fg + ';">' +
    '<i class="fa-solid fa-' + s.icon + '"></i></div>';
  return L.divIcon({
    html: html,
    className: "",           // strip default leaflet styling
    iconSize: [22, 22],
    iconAnchor: [11, 11],
  });
}

const sampleLayer = L.layerGroup();
SAMPLES.forEach(function (s) {
  const bits = [s.loc, s.type, s.year].filter(Boolean);
  const tip = bits.join(" · ");
  const m = L.marker([s.lat, s.lon], { icon: badgeIcon(s), keyboard: false });
  if (tip) m.bindTooltip(tip, { direction: "top", offset: [0, -10] });
  m.addTo(sampleLayer);
});
sampleLayer.addTo(map);

// ------------------------------------------------------------------
// Glacier context boxes
// ------------------------------------------------------------------
GLACIER_BOXES.forEach(function (b) {
  L.rectangle(b.bounds, {
    color: b.color,
    weight: 2.5,
    fill: false,
    dashArray: null,
  }).addTo(map);

  // Label anchored at the NE corner of the box.
  const ne = L.latLngBounds(b.bounds).getNorthEast();
  L.marker(ne, {
    interactive: false,
    pane: "labels",
    icon: L.divIcon({
      className: "glacier-label",
      html: '<span style="color:' + b.color + '">' + b.label.replace(/ /g, "<br>") + "</span>",
      iconSize: [130, 40],
      iconAnchor: [-6, 10],
    }),
  }).addTo(map);
});

// ------------------------------------------------------------------
// Place-name labels
// ------------------------------------------------------------------
PLACES.forEach(function (p) {
  L.marker([p.lat, p.lon], {
    interactive: false,
    pane: "labels",
    icon: L.divIcon({ className: "", html: '<div class="place-dot"></div>', iconSize: [7, 7], iconAnchor: [3, 3] }),
  }).addTo(map);
  L.marker([p.lat, p.lon], {
    interactive: false,
    pane: "labels",
    icon: L.divIcon({
      className: "place-label",
      html: p.name,
      iconSize: [120, 18],
      iconAnchor: [-6, 14],
    }),
  }).addTo(map);
});

// ------------------------------------------------------------------
// Legend (bottom-left)
// ------------------------------------------------------------------
const legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  const div = L.DomUtil.create("div", "legend");
  let html = "<h4>Research theme</h4>";
  LEGEND.forEach(function (e) {
    html +=
      '<div class="legend-row">' +
      '<span class="legend-badge" style="background:' + e.bg + ';color:' + e.fg + ';">' +
      '<i class="fa-solid fa-' + e.icon + '"></i></span>' +
      "<span>" + e.label + "</span>" +
      '<span class="legend-count">' + e.count + "</span>" +
      "</div>";
  });
  return div.innerHTML = html, div;
};
legend.addTo(map);

// ------------------------------------------------------------------
// North arrow (bottom-right)
// ------------------------------------------------------------------
const north = L.control({ position: "bottomright" });
north.onAdd = function () {
  const div = L.DomUtil.create("div", "north-arrow");
  div.innerHTML = '<div class="arrow"><i class="fa-solid fa-location-arrow" style="transform:rotate(-45deg)"></i></div><div class="n">N</div>';
  return div;
};
north.addTo(map);

// ------------------------------------------------------------------
// Title card (top-left)
// ------------------------------------------------------------------
const title = L.control({ position: "topleft" });
title.onAdd = function () {
  const div = L.DomUtil.create("div", "title-card");
  div.innerHTML =
    "<h1>GreenFjord sampling locations</h1>" +
    "<p>South Greenland &middot; " + SAMPLES.length + " samples across " + LEGEND.length + " research themes</p>";
  L.DomEvent.disableClickPropagation(div);
  return div;
};
title.addTo(map);
</script>
